---
deployment:
  tasks:
    - export DEPLOYPATH1=/home/kbtechid/public_html/roadtohalal.kbtech.id
    - export DEPLOYPATH2=/home/kbtechid/roadtohalal.kbtech.id
    - /bin/mkdir -p $DEPLOYPATH1 $DEPLOYPATH2
    - /bin/cp -a . $DEPLOYPATH1/
    - /bin/cp -a . $DEPLOYPATH2/
    - /bin/chmod -R 755 $DEPLOYPATH1 $DEPLOYPATH2
    - /bin/find $DEPLOYPATH1 $DEPLOYPATH2 -type f -exec /bin/chmod 644 {} +
